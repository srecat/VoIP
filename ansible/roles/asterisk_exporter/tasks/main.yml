---
- name: Create asterisk_exporter system user
  ansible.builtin.user:
    name: asterisk_exporter
    shell: /usr/sbin/nologin
    system: yes
    create_home: no

- name: Download and unarchive asterisk_exporter
  ansible.builtin.unarchive:
    src: "https://github.com/CpuID/asterisk_exporter/releases/download/v{{ asterisk_exporter_version }}/asterisk_exporter_{{ asterisk_exporter_version }}_linux_amd64.tar.gz"
    dest: /tmp
    remote_src: yes

- name: Copy asterisk_exporter binary
  ansible.builtin.copy:
    src: "/tmp/asterisk_exporter-{{ asterisk_exporter_version }}.linux-amd64/asterisk_exporter"
    dest: /usr/local/bin/asterisk_exporter
    mode: '0755'
    remote_src: yes

- name: Create systemd service for asterisk_exporter
  ansible.builtin.template:
    src: asterisk_exporter.service.j2
    dest: /etc/systemd/system/asterisk_exporter.service
    mode: '0644'
  notify: Restart asterisk_exporter

- name: Ensure asterisk_exporter is started and enabled
  ansible.builtin.systemd:
    name: asterisk_exporter
    state: started
    enabled: yes
    daemon_reload: yes
