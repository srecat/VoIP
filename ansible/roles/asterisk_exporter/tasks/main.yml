---
- name: Create asterisk_exporter system user
  ansible.builtin.user:
    name: asterisk_exporter
    shell: /usr/sbin/nologin
    system: yes
    create_home: no

- name: Install Golang
  ansible.builtin.apt:
    name: golang-go
    state: present
    update_cache: yes

- name: Copy asterisk_exporter binary to /usr/local/bin
  ansible.builtin.copy:
    src: /root/go/bin/asterisk_exporter
    dest: /usr/local/bin/asterisk_exporter
    mode: '0755'
    remote_src: yes

- name: Create systemd service for asterisk_exporter
  ansible.builtin.template:
    src: asterisk_exporter.service.j2
    dest: /etc/systemd/system/asterisk_exporter.service
    mode: '0644'
  notify: Restart asterisk_exporter

- name: Ensure asterisk_exporter is started and enabled
  ansible.builtin.systemd:
    name: asterisk_exporter
    state: started
    enabled: yes
    daemon_reload: yes
